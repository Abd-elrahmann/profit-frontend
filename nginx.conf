# تكوين Nginx لمنع مشاكل الـ cache
# ترتيب location blocks مهم - الأكثر تحديداً أولاً

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 1. منع الـ cache لملف index.html بشكل خاص (الأكثر تحديداً)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Last-Modified "";
        add_header ETag "";
        if_modified_since off;
        access_log off;
        try_files $uri =404;
    }

    # 2. السماح بالـ cache للملفات التي تحتوي على hash في assets (الأكثر تحديداً)
    location ~* ^/assets/.*-[a-f0-9]{8,}\.(js|css|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
        access_log off;
        etag on;
    }

    # 3. منع الـ cache لملفات HTML الأخرى
    location ~* \.(html|htm)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Last-Modified "";
        add_header ETag "";
        if_modified_since off;
        try_files $uri $uri/ /index.html;
    }

    # 4. منع الـ cache للملفات بدون hash (js, css)
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Last-Modified "";
        add_header ETag "";
        if_modified_since off;
    }

    # 5. السماح بالـ cache للصور والخطوط والملفات الثابتة الأخرى
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        etag on;
    }

    # 6. إعدادات عامة - دعم React Router (الأقل تحديداً)
    location / {
        # منع الـ cache للمسارات العامة
        add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # تعطيل الـ logging للملفات الثابتة لتحسين الأداء
    location ~* \.(jpg|jpeg|png|gif|ico|svg|css|js|woff|woff2|ttf|eot)$ {
        access_log off;
    }

    # إضافة ETag بشكل عام
    etag on;
}
